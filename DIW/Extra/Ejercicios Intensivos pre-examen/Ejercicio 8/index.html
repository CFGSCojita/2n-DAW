<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Alertas Dinámicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="app-container min-h-screen bg-slate-900 text-slate-100 p-6">

    <main class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-emerald-400">Configurador de Alertas de Activos</h1>

        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-slate-300">Nueva Alerta</h2>

            <form id="form-alert" class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label class="block text-sm text-slate-400 mb-1">Nombre del Activo</label>
                    <input type="text" id="alert-asset" placeholder="Ej. Bitcoin"
                        class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-white">
                </div>

                <div class="flex-1">
                    <label class="block text-sm text-slate-400 mb-1">Precio Objetivo ($)</label>
                    <input type="number" id="alert-price" placeholder="Ej. 70000"
                        class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-white">
                </div>

                <div class="flex-1">
                    <label class="block text-sm text-slate-400 mb-1">Tipo de Condición</label>
                    <select id="alert-type"
                        class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-white">
                        <option value="max">Precio Máximo (Peligro)</option>
                        <option value="min">Precio Mínimo (Éxito)</option>
                    </select>
                </div>

                <button type="submit"
                    class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-6 py-2 rounded self-end transition-transform hover:scale-105 w-full md:w-auto mt-4 focus:ring-2 focus:ring-emerald-500">
                    Crear Alerta
                </button>
            </form>
        </section>

        <section>
            <h2 class="text-xl font-semibold mb-4 text-slate-300">Alertas Activas</h2>
            <div id="alerts-holder" class="flex flex-col gap-3">
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#form-alert").on("submit", function (e) {
                e.preventDefault();

                let nombre_activo = $("#alert-asset").val();
                let precio = $("#alert-price").val();
                let tipo_condicion = $("#alert-type").val();

                if (nombre_activo === "" || precio < 0) {
                    alert("Introduce los campos correctos");
                    return false;
                }

                let alerta = `
                    <div class="custom-alert ${tipo_condicion}">
                        <span>Alerta para <strong>${nombre_activo}</strong> a un precio de ${precio}</span>
                        <button class="btn-close bg-transparent border-0 font-bold cursor-pointer">X</button>
                    </div>
                `

                $("#alerts-holder").append(alerta);

                $("#alert-asset").val("");
            });

            $("#alerts-holder").on("click", ".btn-close", function() {
                $(this).closest(".custom-alert").fadeOut(300, function() {
                    $(this).remove();
                })
            });
        });
    </script>
</body>
</html>
