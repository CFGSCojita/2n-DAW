<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vincula aquí tu CSS compilado de SASS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="app-container">

    <header class="p-6 max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-4">Panel de Control de Activos</h1>
        
        <!-- Zona de Controles -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <input type="text" id="search-asset" placeholder="Buscar activo..." class="p-2 rounded bg-slate-800 text-white border border-slate-700 focus:outline-none focus:border-emerald-500 w-full sm:w-64">
            <button id="btn-simulate" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-semibold px-4 py-2 rounded transition-colors">
                Simular Mercado
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <!-- Contenedor Principal (Grid) -->
        <div class="assets-grid">
            
            <!-- Tarjeta 1 -->
            <div class="asset-card" data-name="bitcoin">
                <div class="card-header">
                    <h3>Bitcoin</h3>
                    <span class="ticker">BTC</span>
                </div>
                <div class="card-body">
                    <p class="price">$65,250</p>
                    <p class="change positive">+2.4%</p>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="asset-card" data-name="ethereum">
                <div class="card-header">
                    <h3>Ethereum</h3>
                    <span class="ticker">ETH</span>
                </div>
                <div class="card-body">
                    <p class="price">$3,450</p>
                    <p class="change positive">+1.8%</p>
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="asset-card" data-name="solana">
                <div class="card-header">
                    <h3>Solana</h3>
                    <span class="ticker">SOL</span>
                </div>
                <div class="card-body">
                    <p class="price">$150</p>
                    <p class="change negative">-0.5%</p>
                </div>
            </div>

        </div>
    </main>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $(".asset-card").on("click", function() {
                $(".asset-card").removeClass("active");
                $(this).addClass("active");
            });

            $("#search-asset").on("input", function() {
                let busqueda = $(this).val().toLowerCase();

                $(".asset-card").each(function() {
                    let valor = $(this).attr("data-name").toLowerCase();

                    if (valor.includes(busqueda)) {
                        $(this).fadeIn();
                    } else {
                        $(this).fadeOut();
                    }
                });
            });

            $("#btn-simulate").on("click", function() {
                $(".asset-card").each(function() {

                    let porcentajeAleatorio = Math.floor(Math.random() * 201) - 100;

                    let negativo_o_positivo = (porcentajeAleatorio > 0) ? "+" : "-";

                    $(this).find(".change").text(negativo_o_positivo + porcentajeAleatorio + "%");

                    if (porcentajeAleatorio > 0) {
                        $(this).addClass("positive");
                        $(this).removeClass("negative");
                    } else {
                        $(this).addClass("negative");
                        $(this).removeClass("positive");
                    }
                });
            });
        });
    </script>
</body>
</html>
