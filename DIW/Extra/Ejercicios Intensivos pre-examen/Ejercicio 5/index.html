<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Pro-Task Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                Pro-Task Creator</h1>
            <p class="text-slate-400">Añade tareas y controla las restricciones en tiempo real.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <form id="task-form" class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nombre de la
                        Tarea</label>
                    <!-- Añadir aquí el focus -->
                    <input type="text" id="task-title"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 transition focus:shadow-cyan-500/50"
                        placeholder="Mínimo 5 caracteres...">
                    <span id="char-error" class="text-rose-500 text-xs mt-1 block opacity-0 transition-opacity">Debe
                        tener al menos 5 caracteres.</span>
                </div>

                <div class="mb-6">
                    <label
                        class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Prioridad</label>
                    <select id="task-priority"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 transition">
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>

                <button type="submit" id="add-task-btn"
                    class="w-full py-2.5 rounded-lg text-sm font-bold bg-slate-700 text-slate-400 cursor-not-allowed transition disabled:opacity-50 hover:scale-105"
                    disabled>
                    Añadir Tarea
                </button>
            </form>

            <main class="md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Tareas Activas (<span id="task-count">0</span>)</h2>
                </div>

                <div id="tasks-container" class="space-y-3">
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        let contador = $(".task-item").length;

        $(document).ready(function () {
            $("#task-title").on("input", function () {
                let valor = $(this).val().length;

                if (valor < 5) {
                    $(this).siblings("#char-error").removeClass('opacity-0');
                    $('#add-task-btn').prop('disabled', true);
                } else if (valor >= 5) {
                    $(this).siblings("#char-error").addClass('opacity-0');
                    $('#add-task-btn').prop('disabled', false);
                }
            });

            $("#task-form").on("submit", function (e) {
                e.preventDefault();

                let texto = $("#task-title").val();
                let prioridad = $("#task-priority").val();

                let nuevaTarea = $(`
                    <div class="task-item bg-slate-700 p-4 rounded-lg flex justify-between items-center">
                        <div>
                            <span class="text-sm font-medium">${texto}</span>
                            <span class="priority-${prioridad}">${prioridad}</span>
                        </div>
                        <button class="delete-btn text-rose-500">❌</button>
                    </div>
                `);

                nuevaTarea.hide();
                $("#tasks-container").prepend(nuevaTarea);
                contador++;
                nuevaTarea.slideDown();

                $("#task-title").val('');
                $("#add-task-btn").prop('disabled', true);

                $("#task-count").text(contador);
            });

            $("#tasks-container").on("click", ".delete-btn", function() {
                $(this).closest(".task-item").fadeOut(400, function() {
                    $(this).remove();
                });

                contador--;
                $("#task-count").text(contador);
            });

        });
    </script>
</body>

</html>
