<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List Application</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

<h1>Todo List</h1>

<div id="todoList">
  <!-- Tasks will be dynamically added here -->
</div>

<div>
  <p><label for="taskTitle">Task title</label></p>
  <p><input type="text" id="taskTitle" placeholder="Enter task title"></p>
  <p><label for="taskDescription">Task description</label></p></p>
  <p><textarea id="taskDescription" cols="24" rows="8" placeholder="Enter task description"></textarea>
  <p><select id="taskPriority">
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
  </select></p>
  <p><button id="addTaskButton">Add Task</button></p>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script src="diw_examen_ud4_2526ex5.js"></script>
</body>
</html>
