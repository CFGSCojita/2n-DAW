<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen recuperació: Stefan</title>
  <link rel="stylesheet" href="./css/tailwind_output.css">
  <link rel="stylesheet" href="./css/sass.css">
</head>
<body>

  <header class="flex p-4 m-4 justify-between">
    <h1 class="font-bold text-2xl">ShopDemo</h1>
    <button id="menuBtn" class="bg-black text-white p-1 m-1 pl-1 pr-1 rounded lg:hidden">☰</button>
  </header>

  <aside>
    <h2>Filtres</h2>
    <label><input type="checkbox"> Muntanya</label>
    <label><input type="checkbox"> Ciutat</label>
    <label><input type="checkbox"> Mar</label>
  </aside>

  <main>

    <div class="flex p-1 m-1 justify-between">
      <button id="addProduct" class="p-1 m-1 bg-green-500 text-white border border-amber-50 rounded">Afegir producte</button>
      <div>Productes: <span id="count">0</span></div>
    </div>

    <div id="productGrid" class="grid lg:grid-cols-3">
      <!-- cards aquí amb jQuery -->
    </div>

  </main>

  <footer class="flex items-center justify-center font-bold">
    Demo examen
  </footer>


  <script src="./js/jquery-4.0.0.min.js.js"></script>
  <script src="./js/app.js"></script>

</html>
