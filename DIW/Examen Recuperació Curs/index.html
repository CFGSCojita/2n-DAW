<!DOCTYPE html>
<html lang="cat">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen recuperació: Stefan</title>
  <link rel="stylesheet" href="./css/tailwind_output.css">
  <link rel="stylesheet" href="./css/sass.css">
</head>
<body>

  <header class="flex justify-between bg-white p-2 pl-2">
    <h1 class="font-bold text-2xl">ShopDemo</h1>
    <button id="menuBtn" class="bg-black text-white rounded pl-2 pr-2 cursor-pointer">☰</button>
  </header>

  <aside>
    <h2>Filtres</h2>
    <label><input type="checkbox"> Muntanya</label>
    <label><input type="checkbox"> Ciutat</label>
    <label><input type="checkbox"> Mar</label>
  </aside>

  <main>

    <div class="flex justify-between">
      <button id="addProduct" class="bg-lime-600 text-white p-2 m-2 rounded">Afegir producte</button>
      <div class="font-semibold mt-4 mr-2">Productes: <span id="count">0</span></div>
    </div>

    <div id="productGrid" class="grid grid-cols-1 gap-1 md:grid-cols-3">
      <!-- cards aquí amb jQuery -->
    </div>

  </main>

  <footer class="flex justify-center font-bold">
    Demo examen
  </footer>

  <script src="./js/jquery-4.0.0.min.js.js"></script>
  <script src="./js/app.js"></script>
  
</body>
</html>
